name: Test Build
on:
  workflow_dispatch:
    inputs:
      build-mac:
        description: "Build for Mac"
        required: true
        default: true
        type: boolean
      build-win:
        description: "Build for Win"
        required: true
        default: false
        type: boolean
      build-debug:
        description: "Build debug version"
        required: true
        default: true
        type: boolean
      build-release:
        description: "Build release version"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: (inputs.build-mac || inputs.build-win) && (inputs.build-debug || inputs.build-release)
    name: Build ${{ matrix.os }} (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(inputs.build-mac && inputs.build-win && '["macos-latest", "windows-latest"]'
              || inputs.build-mac && '["macos-latest"]' || '["windows-latest"]') }}
        profile: >-
          ${{ fromJSON(inputs.build-debug && inputs.build-release && '["debug", "release"]'
              || inputs.build-debug && '["debug"]' || '["release"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use HTTPS for public Cargo dependencies
        run: git config --global url."https://github.com/tauri-apps/".insteadOf "ssh://git@github.com/tauri-apps/"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.profile }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Set build metadata
        run: |
          version="$(node -p 'require("./package.json").version')"
          {
            echo "VITE_SENTRY_RELEASE=TeyvatGuide@$version"
            echo "VITE_COMMIT_HASH=${GITHUB_SHA:0:9}"
            echo "VITE_BUILD_TIME=$(date +%s)"
          } >> "$GITHUB_ENV"

      - name: Configure Windows offsets
        if: runner.os == 'Windows'
        env:
          YAE_CONF: ${{ secrets.YAE_CONF }}
        run: |
          if [[ -n "$YAE_CONF" ]]; then
            node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.env.YAE_CONF)))' > src-tauri/lib/conf.json
          fi

      - name: Build macOS ARM64 installer
        if: runner.os == 'macOS'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          BUILD_PROFILE: ${{ matrix.profile }}
        run: |
          pnpm tauri build --ci --target aarch64-apple-darwin --bundles dmg ${{ matrix.profile == 'debug' && '--debug' || '' }} -- --locked
          mkdir -p artifacts
          mv "src-tauri/target/aarch64-apple-darwin/$BUILD_PROFILE/bundle/dmg/"*.dmg \
            "artifacts/TeyvatGuide_${GITHUB_SHA}_arm-$BUILD_PROFILE.dmg"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          BUILD_PROFILE: ${{ matrix.profile }}
        run: |
          pnpm tauri build --ci --bundles msi ${{ matrix.profile == 'debug' && '--debug' || '' }} -- --locked
          mkdir -p artifacts
          mv "src-tauri/target/$BUILD_PROFILE/bundle/msi/"*.msi \
            "artifacts/TeyvatGuide_${GITHUB_SHA}_win-$BUILD_PROFILE.msi"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-${{ runner.os == 'macOS' && 'macos-arm' || 'win' }}
          path: artifacts/
          if-no-files-found: error
